name: Scheduled build

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch build and publish on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-and-publish.yml --ref main --repo "$GITHUB_REPOSITORY"

name: Build and publish

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Image version formatted as X.Y.Z
        required: false
      force:
        type: boolean
        description: Publish even if no production code has changed
        required: false
        default: false
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  BuildAndPublish:
    runs-on: ubuntu-latest
    concurrency:
      group: ha-azure-ddns-dns-zone
      cancel-in-progress: false
    environment:
      name: non-prod
      deployment: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Azure login
        uses: azure/login@v3
        with:
          tenant-id: ${{ vars.TENANT_ID }}
          client-id: ${{ vars.CLIENT_ID }}
          subscription-id: ${{ vars.SUBSCRIPTION_ID }}

      - name: Provision DNS zone
        run: |
          ./scripts/infra-up.ps1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build and publish
        env:
          CHANNEL: ${{ github.ref == 'refs/heads/main' && 'stable' || 'beta' }}
          VERSION: ${{ github.event.inputs.version }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/build.ps1 -Channel $env:CHANNEL -Version $env:VERSION -Publish -Force:([bool]::Parse($env:FORCE))

      - name: Clean up DNS zone
        if: always()
        run: |
          ./scripts/infra-down.ps1
